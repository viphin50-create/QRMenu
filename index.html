<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Ресторан: Бургер в 3D</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; font-family: sans-serif; background: #000; }
        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column;
            z-index: 10;
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(20,20,20,1) 100%);
            transition: opacity 0.5s ease;
            overflow-y: auto;
        }
        #ar-ui, #view-3d-ui {
            position: absolute;
            bottom: 30px; width: 100%;
            display: none; justify-content: center;
            z-index: 20;
            gap: 10px;
        }
        .burger-btn {
            background: #ff6b6b; color: white; padding: 15px 30px; border-radius: 50px;
            font-weight: bold; cursor: pointer; border: none; transition: all 0.2s;
        }
        .burger-btn:hover { background: #ff5252; transform: translateY(-2px); }
        .secondary-btn { background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); }
        
        #qrcode-container { background: white; padding: 10px; border-radius: 12px; display: inline-block; }
        @media (max-width: 768px) { #qr-section { display: none; } }
        
        .status-msg {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            padding: 10px 20px; border-radius: 30px; background: rgba(0,0,0,0.7);
            color: white; font-size: 14px; z-index: 100; pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Главный экран -->
    <div id="overlay">
        <header class="p-8 text-white text-center">
            <h1 class="text-5xl font-black italic tracking-tighter">CHEF <span class="text-red-500 underline">AR</span></h1>
            <p class="text-gray-400 mt-3 text-lg">Примерьте еду на своем столе</p>
        </header>

        <main class="flex-grow flex flex-col md:flex-row items-center justify-center p-6 gap-10">
            <div id="menu-card" class="bg-white rounded-[2rem] p-10 shadow-2xl max-w-sm w-full text-center">
                <div class="mb-6 text-8xl">🍔</div>
                <h2 class="text-3xl font-bold text-gray-800 mb-2">Классик Бургер</h2>
                <p class="text-gray-500 mb-8 leading-relaxed">Двойная котлета, много сыра и секретный соус. Посмотрите на него в реальном размере!</p>
                <div class="flex flex-col gap-3">
                    <button id="start-ar-btn" class="burger-btn text-xl">Посмотреть в AR</button>
                    <button id="test-3d-btn" class="burger-btn secondary-btn">Просто 3D вид</button>
                </div>
            </div>

            <div id="qr-section" class="text-center text-white bg-white/5 p-8 rounded-3xl border border-white/10">
                <p class="mb-4 font-bold uppercase tracking-wider text-sm opacity-60">Для работы AR на телефоне:</p>
                <div id="qrcode-container">
                    <div id="qrcode"></div>
                </div>
                <p class="mt-4 text-xs text-red-400 font-mono">Требуется HTTPS</p>
            </div>
        </main>
    </div>

    <!-- Кнопки в режимах -->
    <div id="ar-ui">
        <button id="place-btn" class="burger-btn shadow-2xl">Поставить бургер на стол 🍔</button>
        <button onclick="location.reload()" class="burger-btn secondary-btn shadow-2xl">Выйти</button>
    </div>

    <div id="view-3d-ui">
        <button onclick="location.reload()" class="burger-btn secondary-btn shadow-2xl">Вернуться в меню</button>
    </div>

    <div id="status" class="status-msg hidden"></div>

    <script type="module">
        let camera, scene, renderer, reticle;
        let burgerModel = null;
        let hitTestSource = null;
        let hitTestSourceRequested = false;
        let is3DMode = false;

        const startButton = document.getElementById('start-ar-btn');
        const test3dButton = document.getElementById('test-3d-btn');
        const overlay = document.getElementById('overlay');
        const arUi = document.getElementById('ar-ui');
        const view3dUi = document.getElementById('view-3d-ui');
        const statusBox = document.getElementById('status');

        // Генерация QR
        window.onload = () => {
            new QRCode(document.getElementById("qrcode"), {
                text: window.location.href,
                width: 180, height: 180,
                colorDark : "#000000", colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });
        };

        // Запуск дополненной реальности
        startButton.addEventListener('click', async () => {
            if ('xr' in navigator) {
                try {
                    const session = await navigator.xr.requestSession('immersive-ar', {
                        requiredFeatures: ['hit-test'],
                        optionalFeatures: ['dom-overlay'],
                        domOverlay: { root: document.body }
                    });
                    startSession(session, false);
                } catch (e) {
                    alert("Ошибка запуска AR: " + e.message + "\nПопробуйте открыть в отдельной вкладке браузера через HTTPS.");
                }
            } else {
                alert("WebXR не найден. Ваш браузер не поддерживает AR. \n\nСовет: Если вы на iPhone, используйте Safari. На Android — Chrome.");
            }
        });

        // Запуск обычного 3D режима для теста
        test3dButton.addEventListener('click', () => {
            is3DMode = true;
            overlay.style.display = 'none';
            view3dUi.style.display = 'flex';
            initGraphics(true);
        });

        function startSession(session) {
            overlay.style.display = 'none';
            arUi.style.display = 'flex';
            statusBox.classList.remove('hidden');
            statusBox.innerText = "Ищем стол... Поводите камерой";

            initGraphics(false);
            renderer.xr.setReferenceSpaceType('local');
            renderer.xr.setSession(session);

            session.addEventListener('end', () => location.reload());
        }

        function initGraphics(isPreview) {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

            const light = new THREE.HemisphereLight(0xffffff, 0x444444, 1.5);
            scene.add(light);
            
            const spotLight = new THREE.SpotLight(0xffffff, 1);
            spotLight.position.set(5, 10, 5);
            scene.add(spotLight);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            if (!isPreview) renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            if (isPreview) {
                // В режиме 3D превью ставим бургер в центр и вращаем
                camera.position.set(0, 0.1, 0.3);
                camera.lookAt(0, 0.05, 0);
                burgerModel = createBurger();
                scene.add(burgerModel);
            } else {
                // Прицел для AR
                reticle = new THREE.Mesh(
                    new THREE.RingGeometry(0.04, 0.05, 32).rotateX(-Math.PI / 2),
                    new THREE.MeshBasicMaterial({ color: 0x00ff00 })
                );
                reticle.matrixAutoUpdate = false;
                reticle.visible = false;
                scene.add(reticle);

                document.getElementById('place-btn').addEventListener('click', () => {
                    if (reticle.visible) {
                        const b = createBurger();
                        b.position.setFromMatrixPosition(reticle.matrix);
                        scene.add(b);
                        // Анимация масштаба
                        b.scale.set(0.1, 0.1, 0.1);
                        let s = 0.1;
                        const grow = setInterval(() => {
                            s += 0.1; b.scale.set(s,s,s);
                            if (s >= 1) clearInterval(grow);
                        }, 20);
                    }
                });
            }

            renderer.setAnimationLoop(render);
        }

        function createBurger() {
            const group = new THREE.Group();
            const bunMat = new THREE.MeshPhongMaterial({ color: 0xD2B48C }); 
            const meatMat = new THREE.MeshPhongMaterial({ color: 0x422518 }); 
            const cheeseMat = new THREE.MeshPhongMaterial({ color: 0xFFD700 }); 
            const lettuceMat = new THREE.MeshPhongMaterial({ color: 0x4CAF50 }); 

            const bBun = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.02, 32), bunMat);
            bBun.position.y = 0.01; group.add(bBun);

            const patty = new THREE.Mesh(new THREE.CylinderGeometry(0.062, 0.062, 0.015, 32), meatMat);
            patty.position.y = 0.028; group.add(patty);

            const cheese = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.005, 0.12), cheeseMat);
            cheese.position.y = 0.038; cheese.rotation.y = Math.PI/4; group.add(cheese);

            const lettuce = new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.065, 0.005, 32), lettuceMat);
            lettuce.position.y = 0.043; group.add(lettuce);

            const tBun = new THREE.Mesh(new THREE.SphereGeometry(0.06, 32, 16, 0, Math.PI*2, 0, Math.PI/2), bunMat);
            tBun.position.y = 0.048; group.add(tBun);

            return group;
        }

        function render(timestamp, frame) {
            if (is3DMode && burgerModel) {
                burgerModel.rotation.y += 0.01;
            }

            if (frame && renderer.xr.enabled) {
                const session = renderer.xr.getSession();
                const referenceSpace = renderer.xr.getReferenceSpace();

                if (!hitTestSourceRequested) {
                    session.requestReferenceSpace('viewer').then(ref => {
                        session.requestHitTestSource({ space: ref }).then(src => hitTestSource = src);
                    });
                    hitTestSourceRequested = true;
                }

                if (hitTestSource) {
                    const hits = frame.getHitTestResults(hitTestSource);
                    if (hits.length) {
                        const hit = hits[0];
                        reticle.visible = true;
                        reticle.matrix.fromArray(hit.getPose(referenceSpace).transform.matrix);
                        statusBox.innerText = "Плоскость найдена! Ставьте бургер";
                        statusBox.style.background = "rgba(0,180,0,0.8)";
                    } else {
                        reticle.visible = false;
                        statusBox.innerText = "Ищем стол...";
                        statusBox.style.background = "rgba(0,0,0,0.7)";
                    }
                }
            }
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            if (camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });
    </script>
</body>
</html>
